server {
    listen 80;
    server_name nuviojellyfin.kebabnation.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name nuviojellyfin.kebabnation.xyz;

    ssl_certificate /etc/letsencrypt/live/kebabnation.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kebabnation.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Install URLs contain long base64/json tokens — must not be truncated
        proxy_buffers 8 64k;
        proxy_buffer_size 64k;

        proxy_redirect default;

        # Long-running /Videos/.../stream requests
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}