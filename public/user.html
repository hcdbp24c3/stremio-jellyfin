<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Jellyfin addon</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card2: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #00a4dc;
    --accent2: #0abf6e;
    --red: #e5484d;
    color-scheme: dark;
    --amber: #f5a524;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #16212e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 32px 24px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .logo .dot { width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  h1 { font-size: 20px; font-weight: 700; }
  .subtitle { color: var(--muted); font-size: 13.5px; margin: 4px 0 24px; line-height: 1.6; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .status-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; margin: 6px 0; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }
  .pulse.on { background: var(--accent2); box-shadow: 0 0 0 4px rgba(10,191,110,.15); }
  .pulse.off { background: var(--red); }
  .meta { font-size: 12.5px; color: var(--muted); word-break: break-all; line-height: 1.6; }
  .install-url { display: flex; align-items: center; gap: 8px; background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; margin-top: 12px; }
  .install-url code { flex: 1; font-size: 11px; color: var(--text); word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .copy { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  .privacy { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 18px; padding-top: 12px; line-height: 1.6; }
  .priv { color: var(--accent2); font-weight: 600; }
  #load { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="logo"><div class="dot"></div><h1 id="title">Your Jellyfin addon</h1></div>
  <p class="subtitle" id="subtitle">This page shows only your Jellyfin setup — no other setups are listed here.</p>

  <div id="load">Loading…</div>

  <div class="card hide" id="card">
    <div class="status-row"><span class="pulse" id="pulse"></span><span id="statusText">Checking…</span></div>
    <div class="meta" id="serverMeta"></div>
    <label>Your install link</label>
    <div class="install-url"><code id="installUrl"></code><button class="copy" type="button" id="copyBtn">Copy</button></div>
    <div class="meta" style="margin-top:8px">Open this link in Stremio / Nuvio to add your library.</div>
  </div>

  <p class="privacy" id="privacy">This install link is personal to your Jellyfin server. <span class="priv">Don't share it</span> — it grants access to your library.</p>
</div>

<script>
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

(async () => {
  const segs = location.pathname.split('/').filter(Boolean);
  const key = segs[0] === 's' ? segs[1] : segs[0];
  try {
    const res = await fetch('/api/status/' + encodeURIComponent(key));
    const data = await res.json();
    if (!data.config) throw new Error(data.error || 'not found');

    const cfg = data.config;
    $('load').style.display = 'none';
    $('card').classList.remove('hide');
    $('title').textContent = cfg.name ? 'Jellyfin: ' + cfg.name : 'Your Jellyfin addon';
    $('subtitle').textContent = 'This page shows only this Jellyfin setup — nothing else.';

    if (cfg.jellyfin && cfg.jellyfin.ok) {
      $('pulse').className = 'pulse on';
      $('statusText').textContent = 'Connected to Jellyfin ' + cfg.jellyfin.version;
    } else {
      $('pulse').className = 'pulse off';
      $('statusText').textContent = 'Unreachable: ' + ((cfg.jellyfin && cfg.jellyfin.error) || 'no connection');
    }
    $('serverMeta').textContent = 'Jellyfin server: ' + (cfg.url || 'not set');
    if (cfg.username) $('serverMeta').textContent += ' • User: ' + cfg.username;

    const url = cfg.shortInstallUrl || cfg.installUrl;
    $('installUrl').textContent = url;
    $('copyBtn').addEventListener('click', () => {
      if (navigator.clipboard) navigator.clipboard.writeText(url);
      $('copyBtn').textContent = 'Copied!';
      setTimeout(() => ($('copyBtn').textContent = 'Copy'), 1500);
    });
  } catch (err) {
    $('load').textContent = 'This link is not valid.';
    $('privacy').style.display = 'none';
  }
})();
</script>
</body>
</html>
